  <text x="200" y="306" text-anchor="middle" font-size="26" fill="#0F172A" font-weight="600">d = 1</text>
  <circle cx="200" cy="420" r="9" fill="#DC2626"/>
  <path d="M200 420 L828.3 420" stroke="#DC2626" stroke-width="8"/>
  <circle cx="828.3" cy="420" r="9" fill="#DC2626"/>
  <line x1="200" y1="420" x2="200" y2="445" stroke="#0F172A" stroke-width="3"/>
  <text x="200" y="478" text-anchor="middle" font-size="24" fill="#475569">0</text>
  <line x1="400" y1="420" x2="400" y2="445" stroke="#0F172A" stroke-width="3"/>
  <text x="400" y="478" text-anchor="middle" font-size="24" fill="#475569">1</text>
  <line x1="600" y1="420" x2="600" y2="445" stroke="#0F172A" stroke-width="3"/>
  <text x="600" y="478" text-anchor="middle" font-size="24" fill="#475569">2</text>
  <line x1="800" y1="420" x2="800" y2="445" stroke="#0F172A" stroke-width="3"/>
  <text x="800" y="478" text-anchor="middle" font-size="24" fill="#475569">3</text>
  <text x="828.3" y="478" text-anchor="middle" font-size="26" fill="#DC2626" font-weight="700">π</text>
  <circle cx="828.3" cy="320" r="100" fill="none" stroke="#93C5FD" stroke-width="4" stroke-dasharray="6 8"/>
  <path d="M240 240 Q514.1592653589794 150 788.3 240" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#475569"/></marker></defs>
  <text x="514" y="165" text-anchor="middle" font-size="26" fill="#475569">one full turn</text>
  <text x="600" y="570" text-anchor="middle" font-size="32" font-weight="700" fill="#0F172A">One turn of a circle of diameter 1 covers exactly π = 3.14159…</text>
  <text x="600" y="618" text-anchor="middle" font-size="24" fill="#475569">circumference ÷ diameter is the same for every circle</text>
